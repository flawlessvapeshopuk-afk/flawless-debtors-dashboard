name: Update Debtors Dashboard

on:
  push:
    paths:
      - 'data/**.xlsx'   # triggers only when an xlsx is added/changed in /data

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run processing script
        run: python process.py

      - name: Commit updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard from $(ls data/*.xlsx | tail -1 | xargs basename)"
          git push
